[package]
name = "obsidiana"
version = "0.1.0"
description = "Local-first Markdown knowledge workspace"
edition = "2021"
rust-version = "1.75"
default-run = "obsidiana"

[lib]
name = "obsidiana_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
log = "0.4"
markdown = "1"
notify = "6"
notify-debouncer-mini = "0.4"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
walkdir = "2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
