[package]
name = "obsidiana"
version = "0.1.0"
description = "Local-first Markdown knowledge workspace"
edition = "2021"
rust-version = "1.75"
default-run = "obsidiana"

[lib]
name = "obsidiana_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
