[package]
name = "obsidiana"
version = "0.1.0"
description = "Local-first Markdown knowledge workspace"
edition = "2021"
rust-version = "1.75"
default-run = "obsidiana"

[lib]
name = "obsidiana_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
markdown = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
